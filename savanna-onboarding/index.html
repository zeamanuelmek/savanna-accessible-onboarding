  <template id="dev-template">
    <h1 tabindex="-1">For developers: add Dimts to any site</h1>
    <p>Dimts is a framework-free web component. It works inside Savanna (server-rendered pages, Bootstrap, React islands) and on any other site, such as a job board.</p>
    <h2>1. Install with a script tag</h2>
<pre tabindex="0"><code>&lt;script src="{{BASE}}dimts.js" defer&gt;&lt;/script&gt;
&lt;script src="{{BASE}}forms.js" defer&gt;&lt;/script&gt;

&lt;dimts-form form="signup"&gt;&lt;/dimts-form&gt;</code></pre>
    <p>Built-in forms: <code>signup</code>, <code>passport</code>, <code>employer</code>, <code>apply</code>. Add <code>lang="en"</code> or <code>lang="am"</code> to choose the starting language.</p>
    <h2>2. Listen for the result</h2>
<pre tabindex="0"><code>document.addEventListener('dimts:complete', function (e) {
  // e.detail = { form, instance, lang, answers }
  // Send it to your own API here. Dimts itself sends nothing anywhere.
});</code></pre>
    <h2>3. Make your own form</h2>
<pre tabindex="0"><code>Dimts.register('my-form', {
  fields: [
    { id: 'name', type: 'text', label: { en: 'What is your name?', am: 'ስምዎ ማን ነው?' } },
    { id: 'needs', type: 'multi', options: 'NEEDS', optional: true,
      label: { en: 'What would help you?', am: 'ምን ይረዳዎታል?' },
      audio: { am: '/audio/needs-am.mp3' } }   // optional pre-recorded clip
  ],
  doneTitle: { en: 'Thank you', am: 'እናመሰግናለን' }
});</code></pre>
    <p>Field types: <code>text</code>, <code>tel</code>, <code>email</code>, <code>textarea</code>, <code>choice</code>, <code>multi</code>, <code>consent</code>, <code>ethdate</code> (Ethiopian calendar, stored with the Gregorian date). Options: <code>optional</code>, <code>hint</code>, <code>showIf</code>, <code>prefill</code>, <code>voice: false</code>.</p>
    <h2>Built in</h2>
    <ul>
      <li>One question per screen, the question is the page heading, focus moves to it on every screen.</li>
      <li>No time limits. Answers are saved after every question. "Finish later" gives a resume link (SMS in the live version).</li>
      <li>Read-aloud for every question: pre-recorded audio when provided, otherwise the device's speech engine.</li>
      <li>Voice answers in Amharic or English with "I heard… / Yes / Say it again / Type it instead". Asks consent first, because the browser sends audio to Google.</li>
      <li>Plain error messages with an error summary, "Check your answers" with change links, and prefill so people are never asked twice.</li>
      <li>"Read everything to me" easy mode with large picture answers.</li>
      <li>Job posts are output as schema.org JobPosting with a <code>workplaceSupportOffered</code> property.</li>
    </ul>
    <h2>Roadmap</h2>
    <ul>
      <li>Native-checked recorded Amharic audio for every prompt (offline, no API cost).</li>
      <li>REST API with an OpenAPI spec, and Docker Compose for a one-command install.</li>
      <li>Real SMS resume links through a pluggable provider, offline answer queue.</li>
      <li>Partner console for AAAPD-style organisations.</li>
    </ul>
