# nginx settings for docker compose: static files only.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Same security headers as the live site (savanna-onboarding/vercel.json). Keep the two in step.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    server_tokens off;

    # The service worker must be checked for updates on every visit.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Development files are never served (same as .vercelignore).
    location ~ ^/(tests|tools|node_modules|test-results|playwright-report)(/|$) { return 404; }
    location ~ (^|/)\. { return 404; }
    location ~ ^/(package(-lock)?\.json|playwright\.config\.mjs|vercel\.json)$ { return 404; }

    # Optional Addis AI reference proxy (docker compose --profile addis up). Resolved when a request comes, so nginx
    # still starts without it; the module then falls back to the browser's speech by itself.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $addis_proxy http://addis-proxy:8787;
        proxy_pass $addis_proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 3m;
        proxy_read_timeout 40s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
