# nginx settings for docker compose: static files only.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Development files are never served (same as .vercelignore).
    location ~ ^/(tests|tools|node_modules|test-results|playwright-report)(/|$) { return 404; }
    location ~ (^|/)\. { return 404; }
    location ~ ^/(package(-lock)?\.json|playwright\.config\.mjs)$ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
